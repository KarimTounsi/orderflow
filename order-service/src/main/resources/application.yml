spring:
  application:
    name: order-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/orderflow_orders}
    username: ${SPRING_DATASOURCE_USERNAME:orderflow}
    password: ${SPRING_DATASOURCE_PASSWORD:secret}
    driver-class-name: org.postgresql.Driver

  flyway:
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  data:
    web:
      pageable:
        serialization-mode: via-dto

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

kafka:
  topics:
    order-placed: order-service.order.placed
    fulfillment-completed: fulfillment-service.order.completed
    fulfillment-failed: fulfillment-service.order.failed

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

---
spring:
  config:
    activate:
      on-profile: cloud
  kafka:
    properties:
      security.protocol: SASL_SSL
      sasl.mechanism: PLAIN
      # KAFKA_SASL_JAAS_CONFIG = org.apache.kafka.common.security.plain.PlainLoginModule required
      #   username="<API_KEY>" password="<API_SECRET>"; (z panelu Confluent Cloud, przez env/secret)
      sasl.jaas.config: ${KAFKA_SASL_JAAS_CONFIG}
