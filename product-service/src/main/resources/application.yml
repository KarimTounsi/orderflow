spring:
  application:
    name: product-service

  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]

  threads:
    virtual:
      enabled: true

  mongodb:
    # env z fallbackiem: lokalnie localhost, na AWS SPRING_MONGODB_URI = connection string z Atlas
    uri: ${SPRING_MONGODB_URI:mongodb://localhost:27017/orderflow_products}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/orderflow_vectors}
    username: ${SPRING_DATASOURCE_USERNAME:orderflow}
    password: ${SPRING_DATASOURCE_PASSWORD:secret}

  ai:
    model:
      chat: ${RAG_CHAT_MODEL:none}
      embedding: transformers
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    openai:
      base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api}
      api-key: ${OPENROUTER_API_KEY:}
      chat:
        options:
          model: ${OPENROUTER_MODEL:openai/gpt-5-mini}
          # Niska temperatura = mniej "kreatywnosci" - asystent zakupowy ma trzymac sie faktow
          temperature: 0.2
    vectorstore:
      pgvector:
        initialize-schema: true
        table-name: product_vectors
        dimensions: 384
        index-type: HNSW
        distance-type: COSINE_DISTANCE

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      # Upstash wymaga hasla; lokalnie puste (brak auth)
      password: ${SPRING_DATA_REDIS_PASSWORD:}

    web:
      pageable:
        serialization-mode: via-dto

  cache:
    type: redis
    cache-names: products, categories
    redis:
      time-to-live: 5m

server:
  port: 8081

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: always

---
spring:
  config:
    activate:
      on-profile: cloud
  data:
    redis:
      ssl:
        enabled: true
