spring:
  application:
    name: product-service

  threads:
    virtual:
      enabled: true

  mongodb:
    # env z fallbackiem: lokalnie localhost, na AWS SPRING_MONGODB_URI = connection string z Atlas
    uri: ${SPRING_MONGODB_URI:mongodb://localhost:27017/orderflow_products}

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      # Upstash wymaga hasla; lokalnie puste (brak auth)
      password: ${SPRING_DATA_REDIS_PASSWORD:}

    web:
      pageable:
        serialization-mode: via-dto

  cache:
    type: redis
    cache-names: products, categories
    redis:
      time-to-live: 5m

server:
  port: 8081

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: always

---
spring:
  config:
    activate:
      on-profile: cloud
  data:
    redis:
      ssl:
        enabled: true
